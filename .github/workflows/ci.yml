# Dev CI: lint, typecheck, test, Android debug build (assembleDebug). No deploy/CD.
# Firebase: älä lisää workflowhin vaiheita, jotka tulostavat FIREBASE_* tai .env-sisältöä.
# Tämä jobi ei käytä .env-tiedostoa; bundler saa tyhjät arvot — avaimet eivät tule repoon.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Sama bash-skripti kuin paikallinen WSL: bash scripts/ci-assemble-debug.sh
      - name: Android debug build
        run: bash scripts/ci-assemble-debug.sh
